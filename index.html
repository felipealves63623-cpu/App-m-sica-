<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chord Lab</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:#050914;color:#e8e6dc;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;align-items:center;padding:16px;background:radial-gradient(120% 50% at 50% 105%,#0d4a9a66,transparent 65%),#050914}
.dev{width:100%;max-width:360px;background:linear-gradient(#efe9d6,#d8d0b8);border-radius:22px;padding:14px;box-shadow:0 20px 50px #000a,inset 0 2px 0 #fff8;color:#2a2822}
.top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
#js{width:96px;height:96px;flex:none;border-radius:50%;background:radial-gradient(#1c1c1c,#050505);box-shadow:inset 0 3px 8px #000,0 1px 0 #fff9;display:grid;place-items:center;touch-action:none;position:relative}
#js i{position:absolute;font-style:normal;font-size:9px;color:#8a8a80}
#kn{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfc8b4 55%,#8d866f);box-shadow:0 4px 8px #000a;transition:transform .12s}
#js.on #kn{transition:none}
.scr{flex:1;height:96px;background:#0b130f;border-radius:10px;border:3px solid #26241f;display:flex;overflow:hidden;color:#9ff0b5}
.scr .l{width:44%;padding:6px 6px 4px 8px;display:flex;flex-direction:column;font-size:8px;letter-spacing:.12em;color:#5f8f6f}
canvas{width:100%;flex:1;min-height:0}
.scr .r{flex:1;border-left:1px solid #1f3328;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px}
#cn{font-size:34px;font-weight:300;line-height:1;white-space:nowrap}
.scr small{font-size:9px;letter-spacing:.1em;color:#5f8f6f}
.pads{display:flex;flex-direction:column;gap:8px;align-items:center}
.row{display:flex;gap:8px;width:100%;justify-content:center}
.row.b{width:75%}
.pad{flex:1;height:72px;border:0;border-radius:9px;background:linear-gradient(#f6f0de,#e6dfc9);border-bottom:4px solid #b4ac94;box-shadow:0 1px 0 #fff inset;color:#2a2822;font:600 17px -apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none}
.pad small{font-size:9px;font-weight:400;color:#8a836f}
.pad.on{background:linear-gradient(#cdf3d4,#a9dfb4);border-bottom-width:1px;transform:translateY(3px)}
.ctl{display:flex;gap:6px;margin-top:12px;padding:8px;border-radius:10px;background:#e3dcc6;box-shadow:inset 0 2px 4px #0003;align-items:center}
.ctl button{border:0;border-radius:6px;padding:7px 8px;font:600 9px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#26241f;border-bottom:3px solid #0003;text-align:center;line-height:1.3}
.ctl b{display:block;font-size:12px;letter-spacing:0}
#bT{background:#9fc9a2}#bI{background:#a9c1d6}#bM{background:#e5c46a}
#bB{flex:1;background:none;border:0;color:#4a463a;text-align:right;padding:0;font-size:10px}
.vol{margin:12px 6px 0;text-align:center;font:9px ui-monospace,Menlo,monospace;color:#5a5646}
input[type=range]{width:100%;accent-color:#3a362c;margin:0 0 2px}
.hint{max-width:360px;margin:16px 4px 0;font-size:12px;line-height:1.5;color:#8f93a3;text-align:center}
#sh{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
#sh.on{display:flex}
#sh div{width:100%;max-width:420px;background:#17181d;border-radius:18px 18px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px))}
#sh h3{margin:0 0 12px;font-size:14px;font-weight:600;color:#cfd2dc}
#sh section{display:flex;flex-wrap:wrap;gap:8px}
#sh button{border:1px solid #3a3d48;background:#22242c;color:#e8e6dc;border-radius:9px;padding:10px 14px;font-size:15px;min-width:52px}
#sh button.on{background:#b9e6c2;color:#12201a;border-color:#b9e6c2}
button:focus-visible,#js:focus-visible{outline:2px solid #6aa9ff;outline-offset:2px}
</style></head><body>
<div class="dev">
 <div class="top">
  <div id="js" aria-label="Alavanca de variações"><i style="top:5px">7</i><i style="bottom:5px">sus4</i><i style="left:6px">inv</i><i style="right:4px">add9</i><div id="kn"></div></div>
  <div class="scr"><div class="l">SINAL<canvas id="cv" width="240" height="120"></canvas></div>
   <div class="r"><div id="cn">C</div><small id="vl">TRÍADE</small><small id="tm">RHODES</small></div></div>
 </div>
 <div class="pads"><div class="row" id="r1"></div><div class="row b" id="r2"></div></div>
 <div class="ctl"><button id="bT"></button><button id="bI"></button><button id="bM"></button><button id="bB"></button></div>
 <div class="vol"><input id="vol" type="range" min="0" max="1" step=".01" value=".8" aria-label="Volume">VOLUME</div>
</div>
<p class="hint">Escolha o tom, segure um acorde e mova a alavanca para variar: ↑ sétima, ↗ nona, → add9, ↘ sus2, ↓ sus4, ↙ sexta, ← e ↖ inversões. No computador: teclas 1–7 e setas.</p>
<div id="sh"><div><h3 id="sht"></h3><section id="shs"></section></div></div>
<script>
const $=id=>document.getElementById(id);
const N=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const SC={Maior:[0,2,4,5,7,9,11],Menor:[0,2,3,5,7,8,10]};
const TIMS=['Rhodes','DX Piano','Juno Pad','Órgão','Strings'];
const BP=[0,72,96,120];
const VARS=['7','9','add9','sus2','sus4','6','inv1','inv2'];
const VL={tri:'Tríade','7':'Sétima','9':'Nona',add9:'Add9',sus2:'Sus2',sus4:'Sus4','6':'Sexta',inv1:'1ª inversão',inv2:'2ª inversão'};
const S={key:0,mode:'Maior',tim:0,arp:0,v:'tri'};
let ac,bus,master,an,curD=-1,lastD=0,voices=[],arpT=null;

function deg(d){return SC[S.mode][d%7]+12*Math.floor(d/7)+S.key}
function notes(d,v){
 const ds=[d,d+2,d+4];
 if(v=='7')ds.push(d+6);
 if(v=='9')ds.push(d+6,d+8);
 if(v=='add9')ds.push(d+8);
 if(v=='sus2')ds[1]=d+1;
 if(v=='sus4')ds[1]=d+3;
 if(v=='6')ds.push(d+5);
 const n=ds.map(deg);
 if(v=='inv1')n[0]+=12;
 if(v=='inv2'){n[0]+=12;n[1]+=12}
 return n}
function name(d,v){
 const r=deg(d),i3=deg(d+2)-r,i5=deg(d+4)-r,i7=deg(d+6)-r;
 const q=i3==4?'':(i5==6?'dim':'m');
 const s=q==''?(i7==11?'maj7':'7'):q=='m'?'m7':(i7==10?'m7♭5':'dim7');
 const R=N[r%12];
 if(v=='tri')return R+q;
 if(v=='7')return R+s;
 if(v=='9')return R+s.replace('7','9');
 if(v=='add9')return R+q+'add9';
 if(v=='sus2'||v=='sus4')return R+v;
 if(v=='6')return R+q+'6';
 return R+q+'/'+N[deg(d+(v=='inv1'?2:4))%12]}
const hz=x=>440*Math.pow(2,(48+x-69)/12);

function init(){
 if(ac){if(ac.state!='running')ac.resume();return}
 ac=new (window.AudioContext||window.webkitAudioContext)();
 master=ac.createGain();master.gain.value=+$('vol').value;
 const comp=ac.createDynamicsCompressor();an=ac.createAnalyser();an.fftSize=1024;
 bus=ac.createGain();bus.gain.value=.6;
 const cv=ac.createConvolver(),L=ac.sampleRate*1.8|0,ib=ac.createBuffer(2,L,ac.sampleRate);
 for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.5)}
 cv.buffer=ib;const rg=ac.createGain();rg.gain.value=.3;
 bus.connect(master);bus.connect(cv);cv.connect(rg);rg.connect(master);
 master.connect(comp);comp.connect(an);an.connect(ac.destination)}

function voice(f,type){
 const t=ac.currentTime,g=ac.createGain(),lp=ac.createBiquadFilter(),os=[];
 lp.type='lowpass';g.connect(lp);lp.connect(bus);g.gain.setValueAtTime(0,t);
 const o=(ty,fr,gn,det)=>{const x=ac.createOscillator(),y=ac.createGain();x.type=ty;x.frequency.value=fr;x.detune.value=det||0;y.gain.value=gn;x.connect(y);y.connect(g);x.start(t);os.push(x);return y};
 let rel=.25;
 if(type==0){lp.frequency.value=3500;o('sine',f,.5);o('sine',f*2,.12);
  const b=o('sine',f*7,.15);b.gain.setValueAtTime(.15,t);b.gain.exponentialRampToValueAtTime(.001,t+.35);
  g.gain.linearRampToValueAtTime(.4,t+.008);g.gain.setTargetAtTime(.0001,t+.01,1.6)}
 else if(type==1){lp.frequency.value=7000;
  const c=ac.createOscillator(),m=ac.createOscillator(),mg=ac.createGain();
  c.frequency.value=f;m.frequency.value=f*2;mg.gain.setValueAtTime(f*2.2,t);mg.gain.setTargetAtTime(f*.12,t,.3);
  m.connect(mg);mg.connect(c.frequency);c.connect(g);c.start(t);m.start(t);os.push(c,m);
  g.gain.linearRampToValueAtTime(.32,t+.005);g.gain.setTargetAtTime(.0001,t+.01,1.4)}
 else if(type==2){lp.frequency.value=1400;o('sawtooth',f,.13,-9);o('sawtooth',f,.13,9);o('square',f/2,.08);
  g.gain.linearRampToValueAtTime(.32,t+.3);rel=.9}
 else if(type==3){lp.frequency.value=5000;[1,2,3,4,6].forEach((h,i)=>o('sine',f*h,.35/(i+1)));
  g.gain.linearRampToValueAtTime(.3,t+.012);rel=.08}
 else{lp.frequency.value=2600;o('sawtooth',f,.11,-12);o('sawtooth',f,.11,12);o('sawtooth',f*2,.04,5);
  g.gain.linearRampToValueAtTime(.3,t+.5);rel=.7}
 return()=>{const n=ac.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(g.gain.value,n);g.gain.setTargetAtTime(0,n,rel/3);os.forEach(x=>{try{x.stop(n+rel+.4)}catch(e){}})}}

function stopV(){clearInterval(arpT);voices.forEach(s=>s());voices=[]}
function play(){
 stopV();lastD=curD;const n=notes(curD,S.v);show();
 if(S.arp){const p=n.concat(n.map(x=>x+12)),step=30000/BP[S.arp];let i=0;
  const tick=()=>{const s=voice(hz(p[i++%p.length]),S.tim);setTimeout(s,step*.9)};
  tick();arpT=setInterval(tick,step)}
 else voices=n.map(x=>voice(hz(x),S.tim))}
function down(d){init();curD=d;pads[d].classList.add('on');play()}
function up(d){pads[d].classList.remove('on');if(curD==d){curD=-1;stopV()}}

const pads=[];
function build(){
 for(let d=0;d<7;d++){
  const b=document.createElement('button');b.className='pad';
  b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);down(d)};
  b.onpointerup=b.onpointercancel=()=>up(d);
  b.oncontextmenu=e=>e.preventDefault();
  (d<4?$('r1'):$('r2')).appendChild(b);pads.push(b)}
 labels()}
function labels(){pads.forEach((b,d)=>b.innerHTML=name(d,'tri')+'<small>'+(d+1)+'</small>')}
function show(){
 $('cn').textContent=name(lastD,S.v);$('vl').textContent=VL[S.v].toUpperCase();$('tm').textContent=TIMS[S.tim].toUpperCase();
 $('bT').innerHTML='TOM<b>'+N[S.key]+'</b>';$('bI').innerHTML='TIMBRE<b>'+TIMS[S.tim]+'</b>';$('bM').innerHTML='MODO<b>'+S.mode+'</b>';
 $('bB').textContent=S.arp?'● ARP '+BP[S.arp]+' BPM':'● ARP OFF';labels()}

/* alavanca */
const js=$('js'),kn=$('kn');
function setJ(x,y,max){
 kn.style.transform='translate('+x+'px,'+y+'px)';
 let v='tri';
 if(max&&Math.hypot(x,y)>max*.55){const a=(Math.atan2(y,x)*180/Math.PI+450)%360;v=VARS[Math.round(a/45)%8]}
 if(v!=S.v){S.v=v;if(curD>=0)play();else show();if(navigator.vibrate)navigator.vibrate(8)}}
function mv(e){const r=js.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const max=r.width*.28,d=Math.hypot(x,y);if(d>max){x*=max/d;y*=max/d}setJ(x,y,max)}
js.onpointerdown=e=>{init();js.setPointerCapture(e.pointerId);js.classList.add('on');mv(e)};
js.onpointermove=e=>{if(js.hasPointerCapture(e.pointerId))mv(e)};
js.onpointerup=js.onpointercancel=()=>{js.classList.remove('on');setJ(0,0,0)};

/* menus */
function sheet(t,items,cur,cb){
 $('sht').textContent=t;const s=$('shs');s.innerHTML='';
 items.forEach(([l,v])=>{const b=document.createElement('button');b.textContent=l;if(v==cur)b.className='on';
  b.onclick=()=>{cb(v);$('sh').classList.remove('on');if(curD>=0)play();else show()};s.appendChild(b)});
 $('sh').classList.add('on')}
$('sh').onclick=e=>{if(e.target.id=='sh')$('sh').classList.remove('on')};
$('bT').onclick=()=>sheet('Tom',N.map((n,i)=>[n,i]),S.key,v=>S.key=v);
$('bI').onclick=()=>sheet('Timbre',TIMS.map((n,i)=>[n,i]),S.tim,v=>S.tim=v);
$('bM').onclick=()=>sheet('Modo',Object.keys(SC).map(k=>[k,k]),S.mode,v=>S.mode=v);
$('bB').onclick=()=>{S.arp=(S.arp+1)%BP.length;if(curD>=0)play();else show()};
$('vol').oninput=e=>{if(master)master.gain.value=+e.target.value};

/* teclado */
const ar={};
addEventListener('keydown',e=>{
 if(e.repeat)return;
 if(/^[1-7]$/.test(e.key))down(+e.key-1);
 if(e.key.startsWith('Arrow')){e.preventDefault();ar[e.key]=1;ak()}});
addEventListener('keyup',e=>{
 if(/^[1-7]$/.test(e.key))up(+e.key-1);
 if(e.key.startsWith('Arrow')){delete ar[e.key];ak()}});
function ak(){const x=(ar.ArrowRight?1:0)-(ar.ArrowLeft?1:0),y=(ar.ArrowDown?1:0)-(ar.ArrowUp?1:0),m=27;
 const d=Math.hypot(x,y)||1;setJ(x/d*m*(x||y?1:0),y/d*m*(x||y?1:0),m)}

/* osciloscópio */
const cv=$('cv'),cx=cv.getContext('2d'),buf=new Uint8Array(1024);
(function draw(){
 requestAnimationFrame(draw);
 const w=cv.width,h=cv.height;cx.clearRect(0,0,w,h);
 cx.strokeStyle='#8ff0a8';cx.lineWidth=3;cx.beginPath();
 if(an){an.getByteTimeDomainData(buf);for(let i=0;i<w;i++){const v=(buf[Math.floor(i/w*600)]-128)/128;const y=h/2+v*h*.9;i?cx.lineTo(i,y):cx.moveTo(i,y)}}
 else{cx.moveTo(0,h/2);cx.lineTo(w,h/2)}
 cx.stroke()})();

build();show();
</script></body></html>
